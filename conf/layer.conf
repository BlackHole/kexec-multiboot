# kexec-multiboot: linux-as-bootloader multiboot for Vu+ 4K boxes
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*.bb ${LAYERDIR}/recipes-*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "kexec-multiboot"
BBFILE_PATTERN_kexec-multiboot := "^${LAYERDIR}/"
BBFILE_PRIORITY_kexec-multiboot = "10"

# linux-vuplus-kexec reuses the linux-vuplus recipes of meta-vuplus
LAYERDEPENDS_kexec-multiboot = "core"
LAYERRECOMMENDS_kexec-multiboot = "vuplus-layer"
LAYERSERIES_COMPAT_kexec-multiboot = "wrynose blacksail"
